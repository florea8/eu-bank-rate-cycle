[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bankcycle"
version = "0.1.0"
description = "EU banks and the 2022-2025 ECB rate cycle"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0,<2",
    "psycopg[binary]>=3.2,<4",
    "requests>=2.32,<3",
    "tenacity>=9.0,<10",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
bankcycle = "bankcycle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
