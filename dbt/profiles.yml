# Connection settings come from the same PG* variables as the Python code.
# Run dbt through `bankcycle dbt ...` so they are loaded from .env first.
bankcycle:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PGHOST', 'localhost') }}"
      port: "{{ env_var('PGPORT', '5432') | as_number }}"
      dbname: "{{ env_var('PGDATABASE', 'bankcycle') }}"
      user: "{{ env_var('PGUSER', 'bankcycle') }}"
      password: "{{ env_var('PGPASSWORD') }}"
      schema: staging
      threads: 4
