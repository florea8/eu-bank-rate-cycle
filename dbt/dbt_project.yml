name: bankcycle
version: "0.1.0"
config-version: 2
profile: bankcycle

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]

models:
  bankcycle:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table

vars:
  # First quarter with a quarter-only P&L for most banks: September 2020 is only
  # reported year to date, with no earlier quarter to subtract.
  panel_start: "2020-12-31"
